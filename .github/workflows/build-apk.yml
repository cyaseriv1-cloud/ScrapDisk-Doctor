name: Compilar APK ScrapDisk Doctor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: 4. Compilar APK Release (Firmado con keystore permanente)
        run: ./gradlew assembleRelease --stacktrace

      - name: 5. Renombrar archivo APK para descarga
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/ScrapDisk-Doctor-v1.6.apk

      - name: 6. Subir APK como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: ScrapDisk-Doctor-APK
          path: release-output/ScrapDisk-Doctor-v1.6.apk
          retention-days: 14

      - name: 7. Publicar Release automático en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.6.0
          name: "ScrapDisk Doctor v1.6.0 — Motor Stop Automático"
          body: |
            ### 🛑 ScrapDisk Doctor v1.6.0 — Parada Automática del Motor

            #### ⚡ Nuevo en esta versión:
            1. **Parada automática del motor del disco** al terminar cada prueba. La app envía la señal SCSI `STOP UNIT` al disco USB usando la API nativa de Android 10+. Los cabezales se estacionan y el motor se detiene automáticamente sin que tengas que hacer nada.
            2. **Botón ⏏️ Expulsar mejorado:** ahora usa `StorageVolume.eject()` para ordenar la parada real del disco. Toast confirma: `🛑 Motor del disco detenido`.
            3. **Fallback inteligente:** en Android < 10 o si el sistema no detecta volúmenes USB, muestra instrucciones manuales de expulsión.

            #### ✅ Funcionalidades anteriores incluidas:
            - Detección automática HDD vs SSD con medición de latencia
            - Detección de chip USB-SATA (ASMedia, JMicron, Realtek, etc.)
            - Alertas sonoras diferenciadas + vibración
            - Calculadora de Ganga (💎 GANGAZA / ⚖️ PRECIO JUSTO / 💸 CARO)
            - Modo NTFS automático (discos Windows sin reformatear)
            - Watchdog anti-bucle de 5.5 segundos
          files: release-output/ScrapDisk-Doctor-v1.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
