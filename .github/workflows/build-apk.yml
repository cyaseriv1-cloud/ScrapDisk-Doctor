name: Compilar APK ScrapDisk Doctor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: 4. Compilar APK Release (Firmado con keystore permanente)
        run: ./gradlew assembleRelease --stacktrace

      - name: 5. Renombrar archivo APK para descarga
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/ScrapDisk-Doctor-v1.5.apk

      - name: 6. Subir APK como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: ScrapDisk-Doctor-APK
          path: release-output/ScrapDisk-Doctor-v1.5.apk
          retention-days: 14

      - name: 7. Publicar Release automático en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.5.0
          name: "ScrapDisk Doctor v1.5.0 (Edición Desguace Pro: Audio, Latencia y Ganga)"
          body: |
            ### 🚀 ScrapDisk Doctor v1.5.0 (Edición Desguace Pro)
            
            Versión definitiva con herramientas para comprar discos duros y SSDs en desguaces y mercadillos.
            
            #### ⚡ Nuevas Funcionalidades:
            1. **Detección de Hardware USB:** Identifica en tiempo real el chip puente SATA/NVMe (ASMedia, JMicron, Realtek, etc.) y modelo del dispositivo conectado en el banner superior.
            2. **Medidor de Latencia y Desgaste:** Monitorea el tiempo de respuesta bloque por bloque. Detecta sectores degradados (> 200 ms) antes de que mueran completamente.
            3. **Clasificación Automática HDD vs SSD:** Ajusta los umbrales de diagnóstico reconociendo si conectaste un disco mecánico (💽) o un disco sólido (⚡).
            4. **Alertas Sonoras (Beeps Nativos):** Pitidos diferenciados (Doble tono agudo = Bueno, Tono grave = Dañado) para diagnosticar "a ciegas" bajo la luz del sol sin mirar la pantalla.
            5. **Calculadora de "Precio Justo / Ganga":** Evalúa el precio pedido vs capacidad y te avisa si es una GANGAZA (💎), un PRECIO JUSTO (⚖️) o está CARO (💸).
          files: release-output/ScrapDisk-Doctor-v1.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
