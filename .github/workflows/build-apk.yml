name: Compilar APK ScrapDisk Doctor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: 4. Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: 5. Renombrar archivo APK para descarga
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/ScrapDisk-Doctor-v1.1.apk

      - name: 6. Subir APK como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: ScrapDisk-Doctor-APK
          path: release-output/ScrapDisk-Doctor-v1.1.apk
          retention-days: 14

      - name: 7. Publicar Release automático en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.1.0
          name: "ScrapDisk Doctor v1.1.0 (Versión Rápida Anti-Cuelgues)"
          body: |
            ### 🚀 ScrapDisk Doctor v1.1.0 (Actualización Anti-Cuelgues)
            
            Versión optimizada y simplificada al máximo para evitar congelamientos al conectar discos duros por OTG.
            
            #### ⚡ Novedades en v1.1.0:
            - **Protección Anti-Cuelgues:** Timeouts estrictos de 6 segundos. Si un disco está trabado mecánicamente o tiene sectores muertos que congelan el teléfono, la app corta la prueba de inmediato y te avisa: `🔴 NO COMPRAR (DISCO TRABADO)`.
            - **Prueba Ultra Rápida (2 MB en 3 segundos):** Reducción de la carga I/O a paquetes de 32 KB para evitar saturar el búfer de Android.
            - **Detección de formato NTFS:** Si el disco está en formato de Windows (NTFS), Android bloquea la escritura. La app detecta esto y prueba la lectura en lugar de congelarse, marcando `🟡 DISCO NTFS (OPERATIVO)`.
            - **Interfaz de 1 solo toque:** Se eliminaron selectores complejos; un solo botón grande para probar en 3 segundos.
          files: release-output/ScrapDisk-Doctor-v1.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
