name: Compilar APK ScrapDisk Doctor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: 4. Compilar APK Release (Firmado con keystore permanente)
        run: ./gradlew assembleRelease --stacktrace

      - name: 5. Renombrar archivo APK para descarga
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/ScrapDisk-Doctor-v1.3.apk

      - name: 6. Subir APK como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: ScrapDisk-Doctor-APK
          path: release-output/ScrapDisk-Doctor-v1.3.apk
          retention-days: 14

      - name: 7. Publicar Release automático en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.3.0
          name: "ScrapDisk Doctor v1.3.0 (Botón de Parar y Anti-Cuelgues)"
          body: |
            ### 🚀 ScrapDisk Doctor v1.3.0
            
            #### ⚡ Mejoras clave añadidas:
            1. **Botón de PARAR / CANCELAR en tiempo real:**
               - Mientras la app está diagnosticando, el botón principal se transforma en **`⏹️ CANCELAR PRUEBA`** en color rojo.
               - Si una partición tarda mucho o está en mal estado, puedes tocarlo en cualquier momento para detener la prueba de inmediato **sin necesidad de desconectar el cable OTG**.
            2. **Temporizador Guardián en pantalla (Watchdog de 5.5s):**
               - Si una partición defectuosa congela el controlador del sistema, la pantalla corta automáticamente a los 5.5 segundos y te muestra: `🔴 PARTICIÓN DAÑADA / TRABADA`.
            3. **Lectura ligera con cursor directo:**
               - Evita sobrecargar la memoria en particiones de Windows con miles de archivos.
          files: release-output/ScrapDisk-Doctor-v1.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
