name: Compilar APK ScrapDisk Doctor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: 4. Compilar APK Release (Firmado con keystore permanente)
        run: ./gradlew assembleRelease --stacktrace

      - name: 5. Renombrar archivo APK para descarga
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/ScrapDisk-Doctor-v1.4.apk

      - name: 6. Subir APK como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: ScrapDisk-Doctor-APK
          path: release-output/ScrapDisk-Doctor-v1.4.apk
          retention-days: 14

      - name: 7. Publicar Release automático en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.4.0
          name: "ScrapDisk Doctor v1.4.0 (Anti-Indexación y Expulsión Segura)"
          body: |
            ### 🚀 ScrapDisk Doctor v1.4.0
            
            #### ⚡ Mejoras en v1.4.0:
            1. **Detención del "Máximo Esfuerzo" en segundo plano:**
               - Se eliminó la toma de permisos persistentes innecesarios que provocaban que el servicio `MediaScanner` de Android intentara rastrear e indexar todo el disco de 1TB buscando fotos y videos en segundo plano tras terminar el análisis.
               - Liberación inmediata de descriptores de archivos y recolección de basura forzada al culminar la prueba.
            2. **Botón de Expulsión y Reposo Seguro:**
               - Añadido el botón **`⏏️ LIBERAR / EXPULSAR DISCO SEGURO`** que desconecta la app del disco y permite abrir la configuración de almacenamiento para detener los motores de forma segura antes de retirar el cable OTG.
          files: release-output/ScrapDisk-Doctor-v1.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
