name: Compilar APK ScrapDisk Doctor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK con Gradle
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: 4. Compilar APK Release (Firmado con keystore permanente)
        run: ./gradlew assembleRelease --stacktrace

      - name: 5. Renombrar archivo APK para descarga
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/ScrapDisk-Doctor-v1.2.apk

      - name: 6. Subir APK como artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: ScrapDisk-Doctor-APK
          path: release-output/ScrapDisk-Doctor-v1.2.apk
          retention-days: 14

      - name: 7. Publicar Release automático en GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "ScrapDisk Doctor v1.2.0 (Firma Fija y Anti-Bucle)"
          body: |
            ### 🚀 ScrapDisk Doctor v1.2.0
            
            #### 🛠️ Soluciones en esta versión:
            1. **Firma criptográfica permanente y fija (`keystore.jks`):** Se eliminó por completo el conflicto de instalación entre versiones.
               * *Nota para esta primera vez:* Desinstala la versión anterior de tu teléfono antes de instalar esta para limpiar la firma temporal anterior. A partir de ahora, todas las actualizaciones futuras se instalarán directamente.
            2. **Solución definitiva al bucle "Conectando con unidad USB":**
               - Se añadió un **Timeout global estricto de 6 segundos**. Es matemáticamente imposible que la app se quede pegada o en bucle infinito.
               - Detección inmediata de discos en formato **NTFS de Windows**: Android no permite escritura directa en NTFS, por lo que la app detecta esto en 1 milisegundo y realiza un test de lectura a toda velocidad sin trabarse.
          files: release-output/ScrapDisk-Doctor-v1.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
